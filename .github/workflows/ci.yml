name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      BRANCH:
        required: true
        default: 'main'

env:
  BRANCH: ${{ github.event.inputs.BRANCH || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn cache
        uses: actions/cache@v6
        id: cache-yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-nodemodules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and test frontend
        run: yarn build

      - name: Check compatibility with minimum supported Grafana version
        run: |
          MIN_VERSION=$(jq -r '.dependencies.grafanaDependency' src/plugin.json | sed -E 's/^>=\s*//')
          echo "Checking against Grafana ${MIN_VERSION}"
          npx --yes @grafana/levitate@0.17.3 is-compatible \
            --path src/module.ts \
            --target "@grafana/data@${MIN_VERSION},@grafana/ui@${MIN_VERSION},@grafana/runtime@${MIN_VERSION}"

      - name: Setup build environment
        id: build_environment
        run: echo "BUILD_VERSION=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Package plugin
        run: |
          mv dist marvinruder-netdatalocal-datasource
          zip "marvinruder-netdatalocal-datasource-${{ steps.build_environment.outputs.BUILD_VERSION }}.zip" marvinruder-netdatalocal-datasource -r

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: marvinruder-netdatalocal-datasource-${{ steps.build_environment.outputs.BUILD_VERSION }}.zip
          path: ./marvinruder-netdatalocal-datasource-${{ steps.build_environment.outputs.BUILD_VERSION }}.zip

    outputs:
      artifact_name: marvinruder-netdatalocal-datasource-${{ steps.build_environment.outputs.BUILD_VERSION }}.zip
